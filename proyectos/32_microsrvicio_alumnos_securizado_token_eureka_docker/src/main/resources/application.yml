spring:
  profiles:
    active:
    - prod
---
spring:
  application:
    name: servicio-alumnos
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/alumnoscursos
    username: root
    password: ${PASS_DB:root}
  jpa:
    hibernate:
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  config:
    activate:
      on-profile:
      - dev
server:
  port: 8001
security:
  db:
    driver: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/springsecurity
    user: root
    password: root
jwt:
  properties:
    clave: 11111111111111111111111111aaaaaaaaaaaaaaaaaaaaa
    timeout: 84000000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
