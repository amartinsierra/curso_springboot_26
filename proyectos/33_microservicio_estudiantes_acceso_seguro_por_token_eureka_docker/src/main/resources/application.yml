---
spring:
  application:
    name: servicio-estudiantes
  config:
    activate:
      on-profile:
      - prod
server:
  port: 9000
url:
  remote:
    login: http://servicio-alumnos/login
    user: ${REMOTE_USER}
    password: ${REMOTE_PASS}
