spring.application.name=servicio-alumnos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/alumnoscursos
spring.datasource.username=root
spring.datasource.password=${PASS_DB:root}
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.port=8001

security.db.driver=com.mysql.cj.jdbc.Driver
security.db.url=jdbc:mysql://localhost:3307/springsecurity
security.db.user=root
security.db.password=root
jwt.properties.clave=11111111111111111111111111aaaaaaaaaaaaaaaaaaaaa
jwt.properties.timeout=84000000

#eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka